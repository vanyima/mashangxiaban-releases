name: Update version manifest

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --pattern '*.dmg' --pattern '*.exe' --dir release-asset
      - name: Generate latest.json and update website links
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/update-release.mjs
      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json index.html
          git diff --cached --quiet || git commit -m "chore: publish ${{ github.event.release.tag_name }}"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Deploy updated website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
