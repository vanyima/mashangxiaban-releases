name: Update download counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  release:
    types: [published, deleted]

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sum every release asset
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const counts = { windows: 0, mac: 0 };
            for (const release of releases) {
              for (const asset of release.assets || []) {
                const name = asset.name.toLowerCase();
                if (name.endsWith('.exe')) counts.windows += Number(asset.download_count) || 0;
                if (name.endsWith('.dmg')) counts.mac += Number(asset.download_count) || 0;
              }
            }
            let previous = {};
            try { previous = JSON.parse(fs.readFileSync('download-counts.json', 'utf8')); } catch {}
            const unchanged = previous.windows === counts.windows && previous.mac === counts.mac;
            fs.writeFileSync('download-counts.json', `${JSON.stringify({
              ...counts,
              updatedAt: unchanged && previous.updatedAt ? previous.updatedAt : new Date().toISOString(),
            }, null, 2)}\n`);
      - name: Publish refreshed counts
        id: publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add download-counts.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh download counts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed counts
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
